<!doctype html>
<html lang="zh-HK" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fist Palm and Weapons — 正式對戰 UI</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">FPW</div>
      <div>
        <h1>Fist Palm and Weapons</h1>
        <p id="matchMeta" class="muted-text">尚未開始對戰</p>
      </div>
    </div>

    <div class="topbar-actions">
      <button id="themeToggle" class="secondary-button" type="button" aria-label="切換主題">
        切換主題
      </button>
      <button id="lobbyButton" class="secondary-button" type="button">多人對戰</button>
      <button id="newMatchButton" class="primary-button" type="button">新對戰</button>
    </div>

  </header>

  <main id="main" class="app-shell">
    <!-- 左側：對戰資訊 + 控制 -->
    <aside class="control-panel">
      <section class="panel" id="matchSetupPanel">
        <h2>對戰設定</h2>

        <div class="field-row">
          <label class="field-label" for="humanCount">遊玩人數</label>
          <select id="humanCount" class="field-control">
            <option value="1" selected>1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
          </select>
        </div>
        <div class="field-row">
          <label class="field-label" for="aiCount">電腦敵人</label>
          <select id="aiCount" class="field-control">
            <option value="0" selected>0 個</option>
            <option value="1">1 個</option>
            <option value="2">2 個</option>
            <option value="3">3 個</option>
          </select>
        </div>
        <div id="characterSelects" class="character-selects"></div>
        <div class="button-row">
          <button id="startMatchButton" class="primary-button" type="button">開始對戰</button>
        </div>
      </section>

      <!-- 對戰紀錄：開始對戰後顯示，佔據「對戰設定」原本位置 -->
      <section class="panel log-panel" id="logPanel" hidden>
        <h2>對戰紀錄</h2>
        <div id="logView" class="log-list">
          <p class="muted-text">尚無紀錄。</p>
        </div>
      </section>



      <section class="panel">
        <h2>回合控制</h2>
        <div id="playerStatus" class="player-status-list">
          <p class="muted-text">開始對戰後顯示玩家狀態。</p>
        </div>
        <div class="button-row">
          <button id="playTurnButton" class="primary-button" type="button" disabled>結算回合</button>
          <button id="resetButton" class="secondary-button" type="button" disabled>重設</button>
        </div>
      </section>


      <section class="panel">
        <details class="help-panel" closed>
          <summary>操作提示</summary>
          <ul class="notes-list">
            <li>點擊手牌加入本回合選牌。</li>
            <li>攻擊卡需點擊敵人選擇目標；移動卡需點擊地圖選擇移動目標。</li>
            <li>購買卡會開啟解封武功。</li>
            <li>所有玩家選完牌後按「結算回合」。</li>
          </ul>
        </details>
      </section>
    </aside>

    <!-- 中央：棋盤 -->
    <section class="board-panel">
      <!-- I-02-H：打出嘅牌按順序左至右喺上方列出 -->
      <section class="panel selected-panel">
        <h2>本回合選牌</h2>
        <div id="selectedCardsView" class="selected-cards-view">
          <p class="muted-text">尚未選牌。</p>
        </div>
      </section>

      <div id="boardView" class="board-view">
        <p class="muted-text">開始對戰後顯示 5×5 棋盤。</p>
      </div>
    </section>

    <!-- 右側：解封武功 -->
    <aside class="side-panel">
      <section class="panel">
        <h2>解封武功</h2>
        <div id="shopView" class="shop-view">
          <p class="muted-text">使用購買卡後開啟解封武功。</p>
        </div>
      </section>

      <!-- I-02-H2/H3：選擇模式提示（移到右邊「解封武功」下方） -->
      <section class="panel" id="boardSelectionHintPanel" hidden>
        <h2>操作提示</h2>
        <div id="boardSelectionHint" class="board-selection-hint"></div>
      </section>

    </aside>

  </main>


  <!-- 底部：手牌扇形（I-02-H） -->

  <section class="hand-panel">
    <div id="handView" class="hand-view">
      <p class="muted-text">開始對戰後顯示手牌。</p>
    </div>
  </section>


  <!-- 模態層 -->
  <div id="modalRoot" class="modal-root" hidden></div>

  <!-- 教學提示浮層（首次開始對戰時顯示一次） -->
  <div id="tutorialRoot" class="modal-root" hidden></div>

  <!-- Socket.IO client（由 server 提供） -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
