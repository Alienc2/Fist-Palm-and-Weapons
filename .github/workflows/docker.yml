# .github/workflows/docker.yml
# Phase J-02：Docker 建置驗證（GitHub Actions）
# 觸發：main 分支 push + pull_request
# 步驟：建置 Docker 映像 → 啟動容器 → 驗證 /api/health

name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: fpw-client:ci

      - name: Run container
        run: docker run -d --name fpw-ci -p 4000:4000 -e PORT=4000 fpw-client:ci

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health > /dev/null && echo "Server is ready" && exit 0
            sleep 1
          done
          echo "Server did not become ready in time"
          exit 1

      - name: Verify health endpoint
        run: curl -sf http://localhost:4000/api/health

      - name: Cleanup
        if: ${{ always() }}
        run: docker rm -f fpw-ci || true
